# Controleert elke wijziging: types, tests en of public/app.js mee is herbouwd. Daarna de app zelf in
# Chrome (ook als Galaxy Tab), Safari (WebKit, iPhone en iPad) en Firefox, en de volledige doorloop.
name: Controle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Is public/app.js up-to-date?
        run: |
          npm run build
          git diff --stat --exit-code public/app.js public/catalogus/app.js public/sw.js || {
            echo "::error::Voer 'npm run build' uit en commit public/app.js, public/catalogus/app.js en public/sw.js mee."
            exit 1
          }

  browsers:
    # Vast op 24.04: de browsers van Playwright 1.56 zijn voor die versie gemaakt.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Playwright en de drie browsers (enkel voor de test, niet in de app)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Chrome, Safari (WebKit) en Firefox op gsm, tablet en computer
        run: |
          python3 -m http.server 8080 --directory public >/dev/null 2>&1 &
          sleep 1
          node tests/e2e/browsers.cjs .tests/browsers

      - name: Doorloop beursdag, inloggen, printen en de klantenpagina online (Chromium)
        run: |
          python3 -m http.server 8080 --directory public >/dev/null 2>&1 &
          sleep 1
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .tests
          include-hidden-files: true
          retention-days: 7
