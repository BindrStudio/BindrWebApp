# Controleert elke wijziging: types, tests en of public/app.js mee is herbouwd.
name: Controle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Is public/app.js up-to-date?
        run: |
          npm run build
          git diff --stat --exit-code public/app.js public/sw.js || {
            echo "::error::Voer 'npm run build' uit en commit public/app.js en public/sw.js mee."
            exit 1
          }
