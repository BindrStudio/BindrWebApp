# Zet de app online op GitHub Pages, met elke nacht een verse Cardmarket-prijsgids en twee keer per dag onze
# laatste Instagram-berichten (via de feed uit Profiel › Instagram).
name: App publiceren

on:
  push:
    branches: [main]
  schedule:
    # Elke nacht om 03:20 UTC (05:20 Belgische zomertijd), na de nachtelijke update van Cardmarket.
    - cron: "20 3 * * *"
    # En 's middags nog eens, voor nieuwe Instagram-berichten (de gratis feed van Behold wordt één keer per dag bijgewerkt).
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # om de nachtelijke planning actief te houden (zie onderaan)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Een gratis Supabase-project pauzeert na een week zonder verkeer. Eén vraag per nacht houdt het wakker (vóór
      # Instagram: dat leest de feed uit Supabase).
      - name: Supabase wakker houden
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null \
            "https://thnrmrvpkcrujxtwwqhy.supabase.co/rest/v1/publieke_vitrine?select=naam&limit=1" \
            -H "apikey: sb_publishable_rFo0QZlgdsQTMOU7buKHJg_hMBrCSPV"

      - name: Cardmarket-prijsgids ophalen
        run: node scripts/fetch-prices.mjs || echo "::warning::Prijsgids niet opgehaald; de vorige versie blijft online"

      # Onze laatste berichten voor de Instagram-strook (de klanten vragen de feed zo nooit zelf op). Lukt het niet,
      # dan blijven de berichten van de vorige keer staan; het script laat de publicatie nooit mislukken.
      - name: Instagram ophalen
        run: node scripts/instagram.mjs

      - name: Staat GitHub Pages aan?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1 || {
            echo "::error::GitHub Pages staat nog niet aan. De repo moet openbaar zijn; zet dan Settings › Pages › Source op 'GitHub Actions' en start deze workflow opnieuw."
            exit 1
          }

      # GitHub zet geplande workflows in een openbare repo stil na 60 dagen zonder activiteit.
      # Ze opnieuw 'aanzetten' via de API start die 60 dagen opnieuw, zonder extra commits.
      - name: Nachtelijke planning actief houden
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in publiceren.yml catalogus.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
